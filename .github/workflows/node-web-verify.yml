name: Atelier Runtime V1

on:
  workflow_call:
    inputs:
      request_id:
        description: Stable caller request identifier
        required: true
        type: string
      idempotency_key:
        description: Stable overlap-control key
        required: true
        type: string
      runtime_sha:
        description: Exact lowercase 40-character Runtime commit SHA
        required: true
        type: string
      target_sha:
        description: Exact lowercase 40-character target commit SHA
        required: true
        type: string
      profile:
        description: Runtime profile
        required: true
        type: string
      profile_version:
        description: Runtime profile version
        required: true
        type: number

permissions:
  contents: read

concurrency:
  group: atelier-runtime-${{ github.repository_id }}-${{ inputs.idempotency_key }}
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ATELIER_RUNTIME_EVIDENCE_DIR: runtime-evidence
    steps:
      - name: Validate fixed request surface
        shell: bash
        env:
          RUNTIME_SHA: ${{ inputs.runtime_sha }}
          TARGET_SHA: ${{ inputs.target_sha }}
          PROFILE: ${{ inputs.profile }}
          PROFILE_VERSION: ${{ inputs.profile_version }}
        run: |
          if ! [[ "$RUNTIME_SHA" =~ ^[0-9a-f]{40}$ ]]; then echo "G8_FAILURE_CLASS=BLOCKED"; echo "G8_FAILURE_STAGE=PREFLIGHT"; echo "G8_FAILURE_REASON=INVALID_RUNTIME_SHA"; exit 2; fi
          if ! [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]; then echo "G8_FAILURE_CLASS=BLOCKED"; echo "G8_FAILURE_STAGE=PREFLIGHT"; echo "G8_FAILURE_REASON=INVALID_TARGET_SHA"; exit 2; fi
          if [[ "$PROFILE" != "NODE_WEB_VERIFY" ]]; then echo "G8_FAILURE_CLASS=BLOCKED"; echo "G8_FAILURE_STAGE=PREFLIGHT"; echo "G8_FAILURE_REASON=INVALID_PROFILE"; exit 2; fi
          if [[ "$PROFILE_VERSION" != "1" ]]; then echo "G8_FAILURE_CLASS=BLOCKED"; echo "G8_FAILURE_STAGE=PREFLIGHT"; echo "G8_FAILURE_REASON=INVALID_PROFILE_VERSION"; exit 2; fi
      - name: Checkout Runtime source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: neoflowcore/atelier-runtime
          ref: ${{ inputs.runtime_sha }}
          path: runtime
          persist-credentials: false
      - name: Checkout exact target source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ github.repository }}
          ref: ${{ inputs.target_sha }}
          path: target
          persist-credentials: false
      - name: Set up fixed Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.13.0
      - name: Verify bootstrap identities
        shell: bash
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
          RUNTIME_SHA: ${{ inputs.runtime_sha }}
        run: |
          test "$(git -C runtime rev-parse HEAD)" = "$RUNTIME_SHA"
          test "$(git -C target rev-parse HEAD)" = "$TARGET_SHA"
          test -s runtime/VERSION
          echo "G2_RUNTIME_BOOTSTRAP=PASS"
      - name: Initialize receipt source evidence
        id: receipt_init
        continue-on-error: true
        run: node runtime/runtime/run-receipt-init.mjs target runtime
      - name: Validate target Runtime contract
        id: preflight
        run: node runtime/runtime/run-preflight.mjs target
      - name: Install and run declared stages
        id: stages
        run: node runtime/runtime/run-stages.mjs target
      - name: Run temporary dev server and HTTP validation
        id: web
        run: node runtime/runtime/run-web.mjs target
      - name: Run Chromium and Playwright browser validation
        id: browser
        run: node runtime/runtime/run-browser.mjs target
      - name: Upload browser failure evidence
        if: failure() && steps.browser.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: g6-browser-failure-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            target/test-results
            target/playwright-report
      - name: Finalize canonical Runtime receipt
        id: receipt_finalize
        if: always()
        env:
          ATELIER_REQUEST_ID: ${{ inputs.request_id }}
          ATELIER_IDEMPOTENCY_KEY: ${{ inputs.idempotency_key }}
          ATELIER_TARGET_SHA: ${{ inputs.target_sha }}
          ATELIER_RUNTIME_SHA: ${{ inputs.runtime_sha }}
          ATELIER_PROFILE: ${{ inputs.profile }}
          ATELIER_PROFILE_VERSION: ${{ inputs.profile_version }}
          ATELIER_RECEIPT_INIT_OUTCOME: ${{ steps.receipt_init.outcome }}
          ATELIER_PREFLIGHT_OUTCOME: ${{ steps.preflight.outcome }}
          ATELIER_STAGES_OUTCOME: ${{ steps.stages.outcome }}
          ATELIER_WEB_OUTCOME: ${{ steps.web.outcome }}
          ATELIER_BROWSER_OUTCOME: ${{ steps.browser.outcome }}
        run: node runtime/runtime/run-receipt-finalize.mjs target runtime
      - name: Upload canonical Runtime receipt
        id: receipt_upload
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: runtime-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 7
          path: runtime-evidence/runtime-receipt.json
      - name: Enforce canonical G7 PASS
        if: always()
        env:
          ATELIER_RECEIPT_FINALIZE_OUTCOME: ${{ steps.receipt_finalize.outcome }}
          ATELIER_RECEIPT_UPLOAD_OUTCOME: ${{ steps.receipt_upload.outcome }}
        run: node runtime/runtime/run-receipt-gate.mjs runtime-evidence/runtime-receipt.json
