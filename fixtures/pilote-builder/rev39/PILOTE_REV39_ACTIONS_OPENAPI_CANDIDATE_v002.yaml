openapi: 3.1.0
info:
  title: GitHub Approved Write for Atelier Dev Pilote Rev3.9 R39-P1 Candidate
  version: 3.9-r39-p1-candidate.2
  description: >
    GPT Actions parser-compatible GitHub schema for Pilote Rev3.9 R39-P1.
    Preserves the Rev3.3 actual 20-operation surface and adds bounded CI evidence reads
    plus one exact approved Atelier Runtime caller dispatch. No merge, ready-for-review,
    auto-merge, ref deletion, workflow rerun, arbitrary workflow dispatch, repository settings,
    secrets, admin mutation, or high-level file write endpoints are exposed.
servers:
  - url: https://api.github.com
paths:
  /repos/{owner}/{repo}:
    get:
      operationId: getRepository
      summary: Get repository metadata
      parameters:
        - {name: owner, in: path, required: true, schema: {type: string}}
        - {name: repo, in: path, required: true, schema: {type: string}}
      responses: {'200': {description: Repository metadata}}

  /repos/{owner}/{repo}/branches/{branch}:
    get:
      operationId: getBranch
      summary: Get branch and current commit
      parameters:
        - {name: owner, in: path, required: true, schema: {type: string}}
        - {name: repo, in: path, required: true, schema: {type: string}}
        - {name: branch, in: path, required: true, schema: {type: string}}
      responses: {'200': {description: Branch metadata}, '404': {description: Branch not found}}

  /repos/{owner}/{repo}/commits/{ref}:
    get:
      operationId: getCommit
      summary: Get commit metadata
      parameters:
        - {name: owner, in: path, required: true, schema: {type: string}}
        - {name: repo, in: path, required: true, schema: {type: string}}
        - {name: ref, in: path, required: true, schema: {type: string}}
      responses: {'200': {description: Commit metadata}}

  /repos/{owner}/{repo}/git/commits/{commit_sha}:
    get:
      operationId: getGitCommit
      summary: Get Git commit including tree SHA
      parameters:
        - {name: owner, in: path, required: true, schema: {type: string}}
        - {name: repo, in: path, required: true, schema: {type: string}}
        - {name: commit_sha, in: path, required: true, schema: {type: string, pattern: '^[0-9a-fA-F]{40}$'}}
      responses: {'200': {description: Git commit}}

  /repos/{owner}/{repo}/git/commits:
    post:
      operationId: createGitCommit
      summary: Create an approved Git commit object; does not move a branch by itself
      parameters:
        - {name: owner, in: path, required: true, schema: {type: string}}
        - {name: repo, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [message, tree, parents]
              properties:
                message: {type: string}
                tree: {type: string, pattern: '^[0-9a-fA-F]{40}$'}
                parents:
                  type: array
                  minItems: 1
                  maxItems: 1
                  items: {type: string, pattern: '^[0-9a-fA-F]{40}$'}
      responses: {'201': {description: Created commit object}}

  /repos/{owner}/{repo}/compare/{basehead}:
    get:
      operationId: compareCommits
      summary: Compare base...head
      parameters:
        - {name: owner, in: path, required: true, schema: {type: string}}
        - {name: repo, in: path, required: true, schema: {type: string}}
        - {name: basehead, in: path, required: true, schema: {type: string}}
        - {name: per_page, in: query, required: false, schema: {type: integer, default: 100, maximum: 100}}
        - {name: page, in: query, required: false, schema: {type: integer, default: 1}}
      responses: {'200': {description: Comparison}}

  /repos/{owner}/{repo}/git/trees/{tree_sha}:
    get:
      operationId: getGitTree
      summary: Get Git tree
      parameters:
        - {name: owner, in: path, required: true, schema: {type: string}}
        - {name: repo, in: path, required: true, schema: {type: string}}
        - {name: tree_sha, in: path, required: true, schema: {type: string, pattern: '^[0-9a-fA-F]{40}$'}}
        - {name: recursive, in: query, required: false, schema: {type: string}}
      responses: {'200': {description: Git tree}}

  /repos/{owner}/{repo}/git/trees:
    post:
      operationId: createApprovedTree
      summary: Create a new tree from approved entries using the verified PARENT_TREE as base_tree
      parameters:
        - {name: owner, in: path, required: true, schema: {type: string}}
        - {name: repo, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [base_tree, tree]
              properties:
                base_tree: {type: string, pattern: '^[0-9a-fA-F]{40}$'}
                tree:
                  type: array
                  minItems: 1
                  items:
                    oneOf:
                      - type: object
                        additionalProperties: false
                        required: [path, mode, type, content]
                        properties:
                          path: {type: string}
                          mode: {type: string, enum: ['100644','100755']}
                          type: {type: string, const: blob}
                          content: {type: string}
                      - type: object
                        additionalProperties: false
                        required: [path, mode, type, sha]
                        properties:
                          path: {type: string}
                          mode: {type: string, enum: ['100644','100755']}
                          type: {type: string, const: blob}
                          sha:
                            oneOf:
                              - {type: string, pattern: '^[0-9a-fA-F]{40}$'}
                              - {type: 'null'}
      responses: {'201': {description: Created tree}}

  /repos/{owner}/{repo}/git/blobs:
    post:
      operationId: createApprovedBlob
      summary: Create an exact approved immutable Git blob object; does not update any tree, commit, or ref
      parameters:
        - {name: owner, in: path, required: true, schema: {type: string}}
        - {name: repo, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [content, encoding]
              properties:
                content: {type: string}
                encoding: {type: string, enum: ['utf-8','base64']}
      responses:
        '201': {description: Created immutable Git blob}
        '403': {description: Forbidden}
        '404': {description: Repository not found}
        '409': {description: Conflict}
        '422': {description: Validation failure}

  /repos/{owner}/{repo}/git/blobs/{file_sha}:
    get:
      operationId: getGitBlob
      summary: Read back an immutable Git blob by exact SHA
      parameters:
        - {name: owner, in: path, required: true, schema: {type: string}}
        - {name: repo, in: path, required: true, schema: {type: string}}
        - {name: file_sha, in: path, required: true, schema: {type: string, pattern: '^[0-9a-fA-F]{40}$'}}
      responses:
        '200': {description: Git blob readback}
        '403': {description: Forbidden}
        '404': {description: Blob not found}
        '409': {description: Conflict}
        '422': {description: Validation failure}

  /repos/{owner}/{repo}/contents/{path}:
    get:
      operationId: getRepositoryContent
      summary: Get source content at explicit ref
      parameters:
        - {name: owner, in: path, required: true, schema: {type: string}}
        - {name: repo, in: path, required: true, schema: {type: string}}
        - {name: path, in: path, required: true, schema: {type: string}}
        - {name: ref, in: query, required: false, schema: {type: string}}
        - {name: Accept, in: header, required: false, schema: {type: string, default: application/vnd.github.raw+json}}
      responses: {'200': {description: Source content}}

  /repos/{owner}/{repo}/git/refs:
    post:
      operationId: createApprovedPiloteBranch
      summary: Create a dedicated Pilote branch from the exact approved base SHA
      parameters:
        - {name: owner, in: path, required: true, schema: {type: string}}
        - {name: repo, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ref, sha]
              properties:
                ref: {type: string, pattern: '^refs/heads/pilote-CS-[A-Za-z0-9][A-Za-z0-9_-]{0,63}$'}
                sha: {type: string, pattern: '^[0-9a-fA-F]{40}$'}
      responses: {'201': {description: Created reference}, '422': {description: Validation failure}}

  /repos/{owner}/{repo}/git/refs/heads/{branch}:
    patch:
      operationId: updateApprovedPiloteBranch
      summary: Fast-forward only an approved Pilote branch to the created commit; force must remain false
      parameters:
        - {name: owner, in: path, required: true, schema: {type: string}}
        - {name: repo, in: path, required: true, schema: {type: string}}
        - {name: branch, in: path, required: true, schema: {type: string, pattern: '^pilote-CS-[A-Za-z0-9][A-Za-z0-9_-]{0,63}$'}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [sha, force]
              properties:
                sha: {type: string, pattern: '^[0-9a-fA-F]{40}$'}
                force: {type: boolean, const: false}
      responses:
        '200': {description: Updated reference}
        '409': {description: Conflict}
        '422': {description: Validation failure}

  /repos/{owner}/{repo}/actions/runs:
    get:
      operationId: listWorkflowRuns
      summary: List workflow runs
      parameters:
        - {name: owner, in: path, required: true, schema: {type: string}}
        - {name: repo, in: path, required: true, schema: {type: string}}
        - {name: branch, in: query, required: false, schema: {type: string}}
        - {name: head_sha, in: query, required: false, schema: {type: string}}
        - {name: status, in: query, required: false, schema: {type: string}}
        - {name: per_page, in: query, required: false, schema: {type: integer, default: 20, maximum: 100}}
      responses: {'200': {description: Workflow runs}}

  /repos/{owner}/{repo}/actions/runs/{run_id}:
    get:
      operationId: getWorkflowRun
      summary: Get workflow run
      parameters:
        - {name: owner, in: path, required: true, schema: {type: string}}
        - {name: repo, in: path, required: true, schema: {type: string}}
        - {name: run_id, in: path, required: true, schema: {type: integer}}
      responses: {'200': {description: Workflow run}}

  /repos/{owner}/{repo}/actions/runs/{run_id}/attempts/{attempt_number}/jobs:
    get:
      operationId: listWorkflowRunAttemptJobs
      summary: List jobs for a specific run attempt
      parameters:
        - {name: owner, in: path, required: true, schema: {type: string}}
        - {name: repo, in: path, required: true, schema: {type: string}}
        - {name: run_id, in: path, required: true, schema: {type: integer}}
        - {name: attempt_number, in: path, required: true, schema: {type: integer}}
        - {name: per_page, in: query, required: false, schema: {type: integer, default: 100, maximum: 100}}
      responses: {'200': {description: Jobs for run attempt}}

  /repos/{owner}/{repo}/actions/jobs/{job_id}:
    get:
      operationId: getWorkflowJob
      summary: Get one workflow job and steps
      parameters:
        - {name: owner, in: path, required: true, schema: {type: string}}
        - {name: repo, in: path, required: true, schema: {type: string}}
        - {name: job_id, in: path, required: true, schema: {type: integer}}
      responses: {'200': {description: Workflow job}}

  /repos/{owner}/{repo}/pulls:
    get:
      operationId: listPullRequests
      summary: List pull requests
      parameters:
        - {name: owner, in: path, required: true, schema: {type: string}}
        - {name: repo, in: path, required: true, schema: {type: string}}
        - {name: state, in: query, required: false, schema: {type: string, enum: [open, closed, all]}}
        - {name: head, in: query, required: false, schema: {type: string}}
        - {name: base, in: query, required: false, schema: {type: string}}
      responses: {'200': {description: Pull requests}}
    post:
      operationId: createApprovedDraftPullRequest
      summary: Create an approved Draft PR from a Pilote branch; does not merge
      parameters:
        - {name: owner, in: path, required: true, schema: {type: string}}
        - {name: repo, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [title, head, base, body, draft]
              properties:
                title: {type: string}
                head: {type: string, pattern: '^pilote-CS-[A-Za-z0-9][A-Za-z0-9_-]{0,63}$'}
                base: {type: string}
                body: {type: string}
                draft: {type: boolean, const: true}
                maintainer_can_modify: {type: boolean, const: false, default: false}
      responses: {'201': {description: Created Draft PR}}

  /repos/{owner}/{repo}/pulls/{pull_number}:
    get:
      operationId: getPullRequest
      summary: Read back pull request state including merge state
      parameters:
        - {name: owner, in: path, required: true, schema: {type: string}}
        - {name: repo, in: path, required: true, schema: {type: string}}
        - {name: pull_number, in: path, required: true, schema: {type: integer}}
      responses: {'200': {description: Pull request}}

  /repos/{owner}/{repo}/actions/jobs/{job_id}/logs:
    get:
      operationId: getWorkflowJobLogs
      summary: Read raw logs for one exact workflow job
      parameters:
        - {name: owner, in: path, required: true, schema: {type: string}}
        - {name: repo, in: path, required: true, schema: {type: string}}
        - {name: job_id, in: path, required: true, schema: {type: integer}}
      responses:
        '200': {description: Workflow job logs}
        '302': {description: Temporary redirect to workflow job logs}
        '404': {description: Workflow job not found}

  /repos/{owner}/{repo}/actions/runs/{run_id}/artifacts:
    get:
      operationId: listWorkflowRunArtifacts
      summary: List artifacts bound to one workflow run
      parameters:
        - {name: owner, in: path, required: true, schema: {type: string}}
        - {name: repo, in: path, required: true, schema: {type: string}}
        - {name: run_id, in: path, required: true, schema: {type: integer}}
        - {name: name, in: query, required: false, schema: {type: string}}
        - {name: per_page, in: query, required: false, schema: {type: integer, default: 30, maximum: 100}}
        - {name: page, in: query, required: false, schema: {type: integer, default: 1}}
      responses:
        '200': {description: Workflow run artifacts}
        '404': {description: Workflow run not found}

  /repos/{owner}/{repo}/actions/artifacts/{artifact_id}:
    get:
      operationId: getWorkflowArtifact
      summary: Get workflow artifact metadata by exact artifact ID; does not download artifact bytes
      parameters:
        - {name: owner, in: path, required: true, schema: {type: string}}
        - {name: repo, in: path, required: true, schema: {type: string}}
        - {name: artifact_id, in: path, required: true, schema: {type: integer}}
      responses:
        '200': {description: Workflow artifact metadata}
        '404': {description: Workflow artifact not found}

  /repos/{owner}/{repo}/actions/workflows/atelier-runtime-v1.yml/dispatches:
    post:
      operationId: dispatchApprovedAtelierRuntimeCaller
      summary: Dispatch only the approved Atelier Runtime V1 caller workflow; arbitrary workflow selection is impossible
      parameters:
        - {name: owner, in: path, required: true, schema: {type: string}}
        - {name: repo, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ref, inputs, return_run_details]
              properties:
                ref:
                  type: string
                  minLength: 1
                  maxLength: 255
                  pattern: '^[A-Za-z0-9._/-]+$'
                inputs:
                  type: object
                  additionalProperties: false
                  required: [request_id, idempotency_key, target_sha]
                  properties:
                    request_id:
                      type: string
                      minLength: 1
                      maxLength: 128
                      pattern: '^[A-Za-z0-9._:-]+$'
                    idempotency_key:
                      type: string
                      minLength: 1
                      maxLength: 200
                      pattern: '^[A-Za-z0-9._:-]+$'
                    target_sha:
                      type: string
                      pattern: '^[0-9a-fA-F]{40}$'
                return_run_details:
                  type: boolean
                  const: true
      responses:
        '200': {description: Dispatch accepted with workflow run ID and URLs}
        '204': {description: 'Dispatch accepted without run details; treat as compatibility fallback, not preferred Rev3.9 path'}
        '404': {description: Approved caller workflow or repository not found}
        '422': {description: Invalid ref or caller input validation failure}

